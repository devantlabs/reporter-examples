name: Devant E2E — Mattermost Cypress

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Parallel workers (ubuntu-24.04 = 4vCPU/16GB each, same as mattermost CI)"
        default: "40"
        required: false

jobs:
  # ── 1. Create one Devant run + shard specs ─────────────────────────────────
  begin:
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.create_run.outputs.run_id }}
      matrix: ${{ steps.shard.outputs.matrix }}
    steps:
      - name: Clone mattermost/mattermost (depth 1)
        run: git clone --depth 1 https://github.com/mattermost/mattermost mattermost

      - name: Install Devant reporter into mattermost cypress
        run: cd mattermost/e2e-tests/cypress && npm install -D @devant-net/cypress-reporter@0.1.5

      - name: Patch cypress.config.ts — wire devqReporter after plugins
        run: |
          python3 - mattermost/e2e-tests/cypress/cypress.config.ts <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          imp = "import {defineConfig} from 'cypress';"
          assert imp in s, f"anchor not found: {imp}"
          s = s.replace(imp, imp + "\nimport {devqReporter} from '@devant-net/cypress-reporter';", 1)
          ret = "return require('./tests/plugins/index.js')(on, config);"
          assert ret in s, f"anchor not found: {ret}"
          s = s.replace(ret,
            "const cfg = require('./tests/plugins/index.js')(on, config);\n"
            "            devqReporter(on, cfg || config);\n"
            "            return cfg;", 1)
          open(p, 'w').write(s)
          print("patched:", p)
          PY
          grep -n "devqReporter\|devant" mattermost/e2e-tests/cypress/cypress.config.ts

      - name: Create Devant run
        id: create_run
        run: |
          RID=$(curl -sf -X POST "${{ secrets.DEVANT_CLOUD_API_URL }}/v1/runs" \
            -H "Authorization: Bearer ${{ secrets.DEVANT_CLOUD_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"project_id\":${{ secrets.DEVANT_CLOUD_PROJECT_ID }},\"mode\":\"automated\",\"name\":\"mattermost cypress @prod — ${{ github.run_id }}\",\"framework\":\"cypress\"}" \
            | jq -r .id)
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Created Devant run #$RID"

      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Shard @prod specs into matrix
        id: shard
        working-directory: mattermost/e2e-tests/cypress
        run: |
          node - "${{ github.event.inputs.workers }}" <<'SHARD'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const n = parseInt(process.argv[2] || '40', 10);
          const files = execSync(
            'grep -rlE "Stage:.*@prod|@prod" tests/integration 2>/dev/null | sort',
            { encoding: 'utf8' }
          ).trim().split('\n').filter(Boolean);
          process.stderr.write(`${files.length} @prod specs → ${n} workers\n`);
          const size = Math.ceil(files.length / n);
          const chunks = [];
          for (let i = 0; i < n; i++) {
            const chunk = files.slice(i * size, (i + 1) * size);
            if (chunk.length) chunks.push({ index: i + 1, specs: chunk.join(',') });
          }
          const json = JSON.stringify(chunks);
          // Write to artifact file (avoids GHA secret scanner on GITHUB_OUTPUT)
          fs.writeFileSync('/tmp/matrix.json', json);
          // Also try GITHUB_OUTPUT — if scanner blocks it, artifact is the fallback
          const out = process.env.GITHUB_OUTPUT;
          if (out) fs.appendFileSync(out, `matrix=${json}\n`);
          process.stderr.write(`wrote ${chunks.length} shards\n`);
          SHARD

      - name: Upload matrix artifact (fallback if GITHUB_OUTPUT is redacted)
        uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: /tmp/matrix.json
          retention-days: 1

  # ── helper: read matrix from artifact if GITHUB_OUTPUT was redacted ─────────
  read-matrix:
    needs: begin
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Download matrix artifact
        uses: actions/download-artifact@v4
        with:
          name: matrix
          path: /tmp

      - name: Read matrix
        id: read
        run: |
          MATRIX=$(cat /tmp/matrix.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ── 2. N workers — each own mattermost stack → same Devant run ─────────────
  workers:
    needs: [begin, read-matrix]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.read-matrix.outputs.matrix) }}
    env:
      DEVANT_CLOUD_API_URL: ${{ secrets.DEVANT_CLOUD_API_URL }}
      DEVANT_CLOUD_PROJECT_ID: ${{ secrets.DEVANT_CLOUD_PROJECT_ID }}
      DEVANT_CLOUD_TOKEN: ${{ secrets.DEVANT_CLOUD_TOKEN }}
      DEVANT_CLOUD_RUN_ID: ${{ needs.begin.outputs.run_id }}
      SERVER_IMAGE: mattermostdevelopment/mattermost-team-edition:master
      CI_BASE_URL: worker-${{ matrix.index }}

    steps:
      - name: Clone mattermost/mattermost (depth 1)
        run: git clone --depth 1 https://github.com/mattermost/mattermost mattermost

      - name: Install Devant reporter
        run: cd mattermost/e2e-tests/cypress && npm install -D @devant-net/cypress-reporter@0.1.5

      - name: Patch cypress.config.ts
        run: |
          python3 - mattermost/e2e-tests/cypress/cypress.config.ts <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          s = s.replace("import {defineConfig} from 'cypress';",
            "import {defineConfig} from 'cypress';\nimport {devqReporter} from '@devant-net/cypress-reporter';", 1)
          s = s.replace("return require('./tests/plugins/index.js')(on, config);",
            "const cfg = require('./tests/plugins/index.js')(on, config);\n"
            "            devqReporter(on, cfg || config);\n"
            "            return cfg;", 1)
          open(p, 'w').write(s)
          PY

      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Cache cypress deps
        uses: actions/cache@v4
        with:
          path: mattermost/e2e-tests/cypress/node_modules
          key: cypress-${{ runner.os }}-${{ hashFiles('mattermost/e2e-tests/cypress/package-lock.json') }}

      - name: Install cypress deps
        run: cd mattermost/e2e-tests/cypress && npm ci

      - name: Pre-pull server image
        run: docker pull $SERVER_IMAGE &

      - name: Start mattermost stack
        run: cd mattermost/e2e-tests && SERVER_IMAGE=$SERVER_IMAGE make start-server
        timeout-minutes: 10

      - name: Run shard → Devant run #${{ needs.begin.outputs.run_id }}
        run: |
          cd mattermost/e2e-tests/cypress
          npx cypress run \
            --spec "${{ matrix.specs }}" \
            --config "videosFolder=/tmp/vid-${{ matrix.index }},screenshotsFolder=/tmp/ss-${{ matrix.index }}"
        timeout-minutes: 30

      - name: Stop stack
        if: always()
        run: cd mattermost/e2e-tests && make stop || true

  # ── 3. Complete the Devant run ─────────────────────────────────────────────
  finish:
    needs: [begin, workers]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Complete Devant run #${{ needs.begin.outputs.run_id }}
        run: |
          curl -sf -X POST "${{ secrets.DEVANT_CLOUD_API_URL }}/v1/runs/${{ needs.begin.outputs.run_id }}/complete" \
            -H "Authorization: Bearer ${{ secrets.DEVANT_CLOUD_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"complete"}'
          echo "✅ Run #${{ needs.begin.outputs.run_id }} complete"
